services:
  db:
    image: postgres:16-alpine
    container_name: cardverse-db
    environment:
      POSTGRES_USER: cardverse
      POSTGRES_PASSWORD: cardverse
      POSTGRES_DB: cardverse
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cardverse-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pg_data:
